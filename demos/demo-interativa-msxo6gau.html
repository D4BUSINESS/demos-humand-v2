<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo interativa</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F1F0EC;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 14px 70px;}
.wrap{max-width:820px;width:100%;}
h1{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 4px;}
p.sub{color:#6B6B76;font-size:13px;margin:0 0 16px;}
.panel{background:#fff;border:1px solid #DEDCD4;border-radius:16px;overflow:hidden;}
.stage{position:relative;background:#0F1522;min-height:300px;}
.stage img{width:100%;display:block;}
.point{position:absolute;width:22px;height:22px;border-radius:50%;background:#E8368F;border:2px solid #fff;
  cursor:pointer;transform:translate(-50%,-50%);box-shadow:0 0 0 0 rgba(232,54,143,.55);animation:pulse 2.1s ease-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,54,143,.55);}70%{box-shadow:0 0 0 14px rgba(232,54,143,0);}100%{box-shadow:0 0 0 0 rgba(232,54,143,0);}}
@media (prefers-reduced-motion:reduce){.point{animation:none;}}
.point-cta{background:#25D366;box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:pulse-cta 2.1s ease-out infinite;}
@keyframes pulse-cta{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6);}70%{box-shadow:0 0 0 14px rgba(37,211,102,0);}100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}}
.highlight-box{position:absolute;border:3px solid #FF6A39;border-radius:8px;box-shadow:0 0 0 4px rgba(255,106,57,.16);cursor:pointer;}
.highlight-box.h-static{cursor:default;}
.highlight-box .h-tag{position:absolute;top:-25px;left:-3px;background:#FF6A39;color:#fff;font-size:10.5px;font-weight:700;
  padding:3px 8px;border-radius:6px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;}
.highlight-box.h-cta{border-color:#25D366;box-shadow:0 0 0 4px rgba(37,211,102,.18);}
.highlight-box.h-cta .h-tag{background:#25D366;}
.tooltip-bubble{position:absolute;max-width:230px;background:#fff;color:#1B1B1F;border-radius:11px;padding:11px 13px;
  font-size:12.5px;line-height:1.45;box-shadow:0 10px 26px -8px rgba(0,0,0,.4);z-index:9;}
.tooltip-bubble button{margin-top:9px;background:#5b4fe8;color:#fff;border:none;border-radius:7px;font-size:11.5px;font-weight:600;padding:6px 11px;cursor:pointer;}
.tooltip-bubble button.cta{background:#25D366;}
.nav-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid #DEDCD4;font-size:12px;color:#6B6B76;}
.dots{display:flex;gap:6px;}
.dots span{width:7px;height:7px;border-radius:50%;background:#DEDCD4;}
.dots span.on{background:#5b4fe8;}
.restart{background:none;border:none;color:#5b4fe8;font-weight:600;font-size:12px;cursor:pointer;}

.stage.stage-hub{background:linear-gradient(180deg,#F7F6F2 0%,#EFEDE6 100%);}
.hub-wrap{padding:30px 22px 36px;}
.hub-head{display:flex;align-items:center;gap:13px;margin-bottom:24px;}
.hub-avatar{width:46px;height:46px;border-radius:50%;background:#5b4fe8;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:16px;font-family:'Space Grotesk',sans-serif;flex-shrink:0;
  box-shadow:0 6px 16px -6px #5b4fe880;}
.hub-head h2{margin:0;font-family:'Space Grotesk',sans-serif;font-size:16.5px;color:#1B1B1F;font-weight:700;}
.hub-head p{margin:3px 0 0;font-size:12.5px;color:#8A8A93;}
.hub-list{display:flex;flex-direction:column;gap:10px;}
.hub-item{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid #E9E7E0;
  border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;}
.hub-item:hover{border-color:#5b4fe866;box-shadow:0 10px 22px -12px rgba(20,20,30,.25);transform:translateY(-1px);}
.hub-icon{width:40px;height:40px;border-radius:11px;background:#5b4fe817;color:#5b4fe8;font-size:18px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hub-text{min-width:0;}
.hub-item-title{font-size:14px;font-weight:700;color:#1B1B1F;text-transform:capitalize;line-height:1.3;}
.hub-item-sub{font-size:11.5px;color:#9C9BA3;margin-top:2px;}
.hub-arrow{margin-left:auto;color:#C9C7BF;font-size:18px;flex-shrink:0;}
</style></head>
<body>
<div class="wrap">
  
  <h1>Demo interativa</h1>
  <p class="sub">Clique nos pontos que aparecem na tela para navegar — como se você estivesse usando o sistema de verdade.</p>
  <div class="panel">
    <div class="stage" id="stage"></div>
    <div class="nav-bar">
      <span id="stepLabel"></span>
      <div class="dots" id="dots"></div>
      <button class="restart" id="restart">Recomeçar</button>
      <button class="restart" id="menuBtn" style="display:none;">☰ Seções</button>
    </div>
  </div>
</div>

 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2\">\u003c/path>\u003cpath d=\"M9 12h12l-3 -3\">\u003c/path>\u003cpath d=\"M18 15l3 -3\">\u003c/path>\u003c/svg>\u003c/span>Sair\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv tabindex=\"-1\" data-testid=\"sentinelEnd\">\u003c/div>\u003c/div>\u003cdiv id=\"voiceflow-chat\">\u003c/div>\u003c/body>\u003c/html>","points":[]},{"id":1786997496440.165,"type":"case","points":[],"caseCompany":"MRV&CO","caseIndustry":"Construção · Brasil","caseStats":[{"value":"80%","label":"de usuários ativos"},{"value":"90%","label":"interagem semanalmente"},{"value":"3 meses","label":"até a meta de engajamento"}],"caseQuote":"A Humand se tornou o parceiro que ouve e evolui junto com a gente — não uma solução genérica.","caseAuthor":"Time de Comunicação Interna","caseRole":"MRV&CO","caseVideoUrl":"https://www.facebook.com/61588532736542/videos/caso-de-sucesso-mrv-humand-mais-de-20000-colaboradores-e-presen%C3%A7a-em-mais-de-100/1282177596668115/","caseUrl":"https://humand.co/pt/historia-de-sucesso/mrvco-solucao-ideal/"}];
const CONTACT_HREF = "";
const TRACKING_URL = "https://script.google.com/macros/s/AKfycbwEHDmYsv66e3fskM8oyj29T_yfwFluF1YOslQozTcOV53aKqHOALyOa2ZdpBPFam9I/exec";
const DEMO_ID = "demo-interativa";
const HUB_ENABLED = true;
const ACCENT = "#5b4fe8";
const CAPTURE_W = 1440, CAPTURE_H = 900;
const SECOES = HUB_ENABLED ? [...new Set(screens.filter(s=>s.segment).map(s=>s.segment))] : [];
let idx = 0;
let showingHub = false;

// ---------- Personalização por link: ?nome=...&empresa=... ----------
const qp = new URLSearchParams(location.search);
const TOKENS = { nome: qp.get('nome') || '', empresa: qp.get('empresa') || '' };
function applyTokens(str){
  if(!str) return str;
  return str.replace(/\{\{\s*nome\s*\}\}/gi, TOKENS.nome || 'você')
            .replace(/\{\{\s*empresa\s*\}\}/gi, TOKENS.empresa || 'sua empresa');
}
document.title = applyTokens(document.title);
document.querySelector('h1').textContent = applyTokens(document.querySelector('h1').textContent);

// ---------- Início automático por segmento: ?segmento=rh ----------
const segmentoParam = (qp.get('segmento') || '').trim().toLowerCase();
if(segmentoParam){
  const alvo = screens.findIndex(s => (s.segment || '').toLowerCase() === segmentoParam);
  if(alvo >= 0) idx = alvo;
} else if(HUB_ENABLED && SECOES.length){
  showingHub = true;
}

// ---------- Rastreamento grátis (Apps Script) — via pixel, sem CORS ----------
function track(event, extra){
  if(!TRACKING_URL) return;
  try{
    const secaoAtual = (screens[idx] && screens[idx].segment) || '';
    const params = new URLSearchParams({ event, demo: DEMO_ID, screen: String(idx+1), secao: secaoAtual, nome: TOKENS.nome, empresa: TOKENS.empresa, ...(extra||{}) });
    new Image().src = TRACKING_URL + (TRACKING_URL.includes('?') ? '&' : '?') + params.toString();
  }catch(err){}
}

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const stepLabel = document.getElementById('stepLabel');

function renderDots(){
  dotsEl.innerHTML = screens.map((_,i)=>'<span class="'+(i===idx?'on':'')+'"></span>').join('');
  stepLabel.textContent = 'Tela ' + (idx+1) + ' de ' + screens.length;
}

const HUB_ICONS = {
  engajamento:'🚀', chat:'💬', ponto:'⏱️', pagamento:'💰', folha:'💰', pagto:'💰',
  reconhecimento:'🏆', treinamento:'🎓', curso:'🎓', comunicacao:'📣', comunicado:'📣',
  beneficio:'🎁', onboarding:'🧭', pesquisa:'📊', clima:'📊', documento:'🗂️', ferias:'🌴',
  organograma:'🧩', vaga:'💼', feed:'📰', perfil:'👤'
};
function hubIconFor(sec){
  const key = sec.toLowerCase();
  const found = Object.keys(HUB_ICONS).find(k=>key.includes(k));
  return found ? HUB_ICONS[found] : '✦';
}
function renderHub(){
  stepLabel.textContent = 'Escolha uma seção';
  dotsEl.innerHTML = '';
  stage.classList.add('stage-hub');

  const wrap = document.createElement('div');
  wrap.className = 'hub-wrap';

  const head = document.createElement('div');
  head.className = 'hub-head';
  const initials = ((TOKENS.empresa || TOKENS.nome || 'RH').trim().match(/S+/g) || ['R','H'])
    .slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const saudacao = TOKENS.nome ? ('Olá, ' + TOKENS.nome) : 'Olá 👋';
  head.innerHTML = '<div class="hub-avatar">'+initials+'</div>'+
    '<div><h2>'+saudacao+'</h2><p>O que você quer conhecer primeiro?</p></div>';
  wrap.appendChild(head);

  const list = document.createElement('div');
  list.className = 'hub-list';
  SECOES.forEach(sec=>{
    const item = document.createElement('button');
    item.className = 'hub-item';
    item.innerHTML =
      '<div class="hub-icon">'+hubIconFor(sec)+'</div>'+
      '<div class="hub-text">'+
        '<div class="hub-item-title">'+sec.replace(/-/g,' ')+'</div>'+
        '<div class="hub-item-sub">Toque para explorar</div>'+
      '</div>'+
      '<div class="hub-arrow">›</div>';
    item.addEventListener('click', ()=>{
      const alvo = screens.findIndex(x=>(x.segment||'')===sec);
      if(alvo>=0){
        idx = alvo;
        showingHub = false;
        track('secao_click', {secao:sec});
        render();
      }
    });
    list.appendChild(item);
  });
  wrap.appendChild(list);
  stage.appendChild(wrap);
  track('menu_view');
}

function buildContextSlide(s, onNext){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:44px 34px;min-height:420px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,'+ACCENT+'14 0%,#FFFDF9 55%);';
  wrap.innerHTML =
    '<div style="font-size:26px;margin-bottom:14px;">👋</div>'+
    '<div style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;line-height:1.35;color:#1B1B1F;margin-bottom:16px;">'+(applyTokens(s.ctxTitle||'')).replace(/</g,'&lt;')+'</div>'+
    '<div style="font-size:14.5px;line-height:1.65;color:#5B5B66;margin-bottom:22px;">'+(applyTokens(s.ctxBody||'')).replace(/</g,'&lt;')+'</div>'+
    '<div style="background:'+ACCENT+'12;border-radius:14px;padding:16px 18px;margin-bottom:28px;">'+
      '<div style="font-size:11px;font-weight:700;color:'+ACCENT+';letter-spacing:.04em;margin-bottom:6px;">💭 PRA REFLETIR</div>'+
      '<div style="font-size:15px;font-style:italic;color:#2A2A33;line-height:1.5;">'+(applyTokens(s.ctxQuestion||'')).replace(/</g,'&lt;')+'</div>'+
    '</div>'+
    '<button id="ctxNextBtn" style="align-self:flex-start;background:'+ACCENT+';color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px -8px '+ACCENT+'80;">'+(s.ctxCta||'Continuar →').replace(/</g,'&lt;')+'</button>';
  wrap.querySelector('#ctxNextBtn').addEventListener('click', onNext);
  return wrap;
}

function buildCaseSlide(s){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:40px 32px;min-height:420px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,'+ACCENT+'0D 0%,#FFFFFF 55%);';
  const stats = (s.caseStats||[]).filter(function(st){return st.value;}).map(function(st){
    return '<div style="flex:1;text-align:center;"><div style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:'+ACCENT+';">'+st.value+'</div><div style="font-size:10.5px;color:#8A8A93;margin-top:2px;">'+(st.label||'')+'</div></div>';
  }).join('');
  wrap.innerHTML =
    '<div style="font-size:11px;font-weight:700;color:'+ACCENT+';letter-spacing:.06em;margin-bottom:8px;">🏆 CASE REAL</div>'+
    '<div style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#1B1B1F;margin-bottom:2px;">'+(s.caseCompany||'').replace(/</g,'&lt;')+'</div>'+
    '<div style="font-size:12px;color:#9C9BA3;margin-bottom:22px;">'+(s.caseIndustry||'').replace(/</g,'&lt;')+'</div>'+
    '<div style="display:flex;gap:8px;background:#fff;border-radius:14px;padding:18px 10px;box-shadow:0 6px 18px -10px rgba(20,20,30,.15);margin-bottom:22px;">'+stats+'</div>'+
    '<div style="font-size:14.5px;font-style:italic;color:#333;line-height:1.6;margin-bottom:10px;">"'+(s.caseQuote||'').replace(/</g,'&lt;')+'"</div>'+
    '<div style="font-size:12px;font-weight:700;color:#1B1B1F;margin-bottom:26px;">'+(s.caseAuthor||'').replace(/</g,'&lt;')+(s.caseRole ? ' · '+s.caseRole.replace(/</g,'&lt;') : '')+'</div>'+
    '<button id="caseOpenBtn" style="align-self:flex-start;background:'+ACCENT+';color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px -8px '+ACCENT+'80;">'+(s.caseVideoUrl ? '▶ Assistir o case' : 'Ver case completo →')+'</button>';
  wrap.querySelector('#caseOpenBtn').addEventListener('click', function(){
    const url = s.caseVideoUrl || s.caseUrl;
    if(url){ track('case_click'); window.open(url, '_blank'); }
  });
  return wrap;
}

function render(){
  stage.innerHTML = '';
  if(showingHub){
    renderHub();
    return;
  }
  stage.classList.remove('stage-hub');
  if(!screens.length){
    stage.innerHTML = '<div style="padding:60px 30px;text-align:center;color:#8A8A93;font-size:13px;">Esta demo ainda não tem nenhuma tela adicionada.</div>';
    return;
  }
  const s = screens[idx];
  if(s.type==='context'){
    stage.appendChild(buildContextSlide(s, ()=>{ idx=(idx+1)%screens.length; track('ctx_next'); render(); }));
    renderDots();
    return;
  }
  if(s.type==='case'){
    stage.appendChild(buildCaseSlide(s));
    track('case_view');
    renderDots();
    return;
  }
  const holder = document.createElement('div');
  holder.style.position='relative'; holder.style.width='100%';
  let img;
  if(s.captureHtml){
    img = document.createElement('div');
    img.style.cssText = 'position:relative;width:100%;overflow:hidden;pointer-events:none;';
    const inner = document.createElement('div');
    inner.style.cssText = 'width:'+CAPTURE_W+'px;height:'+CAPTURE_H+'px;transform-origin:top left;pointer-events:none;';
    const ifr = document.createElement('iframe');
    ifr.srcdoc = s.captureHtml;
    ifr.style.cssText = 'width:'+CAPTURE_W+'px;height:'+CAPTURE_H+'px;border:0;display:block;background:#fff;';
    ifr.setAttribute('sandbox','allow-same-origin');
    ifr.setAttribute('scrolling','no');
    inner.appendChild(ifr);
    img.appendChild(inner);
    const fit = ()=>{
      const w = img.clientWidth;
      if(!w) return;
      const scale = w / CAPTURE_W;
      inner.style.transform = 'scale('+scale+')';
      img.style.height = (CAPTURE_H*scale) + 'px';
    };
    requestAnimationFrame(fit);
    if(window.ResizeObserver) new ResizeObserver(fit).observe(img);
    else window.addEventListener('resize', fit);
  } else {
    img = document.createElement('img'); img.src = s.src;
  }
  holder.appendChild(img);
  stage.appendChild(holder);
  s.points.forEach(p=>{
    const isCta = p.target === 'contact';
    if(p.kind==='highlight'){
      const box = document.createElement('div');
      box.className='highlight-box' + (isCta ? ' h-cta' : '') + (p.target ? '' : ' h-static');
      box.style.left=p.x+'%'; box.style.top=p.y+'%'; box.style.width=p.w+'%'; box.style.height=p.h+'%';
      if(p.text || isCta){
        const tag = document.createElement('span');
        tag.className='h-tag'; tag.textContent = applyTokens(p.text) || (isCta ? 'Fale comigo →' : '');
        box.appendChild(tag);
      }
      if(p.target){
        box.tabIndex=0; box.setAttribute('role','button');
        box.addEventListener('click', ()=>handleClick(holder,p));
        box.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();handleClick(holder,p);} });
      }
      holder.appendChild(box);
      return;
    }
    const dot = document.createElement('div');
    dot.className='point' + (isCta ? ' point-cta' : '');
    dot.style.left=p.x+'%'; dot.style.top=p.y+'%';
    dot.tabIndex=0; dot.setAttribute('role','button');
    dot.addEventListener('click', ()=>handleClick(holder,p));
    dot.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();handleClick(holder,p);} });
    holder.appendChild(dot);
  });
  renderDots();
  track('screen_view');
}

function handleClick(holder, p){
  holder.querySelectorAll('.tooltip-bubble').forEach(b=>b.remove());
  const isCta = p.target === 'contact';
  if(p.text){
    const b = document.createElement('div');
    b.className='tooltip-bubble';
    b.style.left = Math.min(p.x,65)+'%'; b.style.top = Math.max(p.y-16,4)+'%';
    b.innerHTML = applyTokens(p.text).replace(/</g,'&lt;') + '<div><button class="'+(isCta?'cta':'')+'">'+(isCta?'Falar agora →':'Avançar')+'</button></div>';
    b.querySelector('button').addEventListener('click', ()=> isCta ? goToContact() : goTo(p.target));
    holder.appendChild(b);
  } else if(isCta){
    goToContact();
  } else {
    goTo(p.target);
  }
}
function goToContact(){
  track('cta_click');
  if(CONTACT_HREF) window.open(CONTACT_HREF, '_blank');
}
function goTo(targetId){
  const i = screens.findIndex(s=>s.id==targetId);
  idx = i>=0 ? i : (idx+1)%screens.length;
  render();
}
document.getElementById('restart').addEventListener('click', ()=>{
  idx=0;
  if(HUB_ENABLED && SECOES.length) showingHub = true;
  track('restart');
  render();
});
const menuBtn = document.getElementById('menuBtn');
if(HUB_ENABLED && SECOES.length){
  menuBtn.style.display = 'inline-block';
  menuBtn.addEventListener('click', ()=>{ showingHub = true; render(); });
}
const fixedContactBtn = document.getElementById('contactBtn');
if(fixedContactBtn) fixedContactBtn.addEventListener('click', ()=> track('cta_click'));
track('demo_open');
render();
</script>
</body></html>
